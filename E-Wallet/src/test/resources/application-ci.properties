# ===== CI Environment Configuration =====

spring.application.name=E-Wallet

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/e-walletdbs
spring.datasource.username=postgres
spring.datasource.password=ci_test_pass

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EWallet-HikariCP

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (dummy)
app.jwt.secret=Y2lEdW1teUp3dFNlY3JldEtleUZvclRlc3RpbmcxMjM0NTY3ODkw
app.jwt.access-expiration=3600000
app.jwt.refresh-expiration=7200000

# Google (dummy)
app.google.client-id=dummy-google-client-id

# Mail (dummy)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Frontend URL
app.auth.frontendUrl=http://localhost:5173

# Tomcat
server.tomcat.threads.min-spare=20
server.tomcat.threads.max=200
server.tomcat.accept-count=10

spring.threads.virtual.enabled=true

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
