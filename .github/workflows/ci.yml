name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'E-Wallet/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Khởi tạo các Services (Database, Cache, Message Broker) ngay trên máy ảo Github Actions
    services:

      # Cấu hình PostgreSQL
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: e-walletdbs
        ports:
          - 5432:5432

        # Đảm bảo DB khởi động xong mới chạy test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      # Cấu hình Redis
      redis:
        image: redis:7
        ports:
          - 6379:6379
          
      # Cấu hình RabbitMQ
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

   # Bắt đầu các bước chạy test
    defaults:
      run:
        working-directory: ./E-Wallet

    steps:
      # 1. Lấy code từ repo về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

      # 2. Cài đặt môi trường (Java 21)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven # Tối ưu: cache lại thư viện maven để lsau build nhanh hơn

      # 3. ACTION CHÍNH: Chạy Maven để Compile và Test
    - name: Build and Test with Maven
      env:
        SPRING_PROFILES_ACTIVE: ci
      run: mvn -B clean package --file pom.xml

      # 4. Lưu kết quả (Tùy chọn)
      # Lấy file .jar vừa build ra lưu lại trên Github để có thể tải xuống kiểm tra
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: e-wallet-app
        path: E-Wallet/target/*.jar
        retention-days: 1
